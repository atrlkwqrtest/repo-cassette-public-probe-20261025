name: Public v7 artifact probe
on: workflow_dispatch
permissions:
  actions: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts @actions/artifact@6.3.1 @azure/storage-blob@12.31.0
      - uses: ./public-v7-probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
